<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CertiCerts — Training Verification</title>
<style>
  :root{--brand:#16294B;--gold:#B8923A;--ok:#1D8A4E;--okbg:#EAF6EF;--okbr:#BFE0CC;--bad:#C2412A;--badbg:#FDF1EF;--badbr:#F2C4BC;--text:#1F2A37;--text2:#5B6B7F;--muted:#8794A6;--line:#E4E9F0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F2F4F8;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px 40px}
  .brand{display:flex;align-items:center;gap:10px;margin:10px 0 18px}
  .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#e8c876,#8a6b1e);display:flex;align-items:center;justify-content:center;color:#1a1206;font-weight:800;font-size:19px}
  .brand b{font-size:19px;color:var(--brand);letter-spacing:.3px}
  .brand span{font-size:12px;color:var(--muted)}
  .card{width:100%;max-width:480px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 34px rgba(25,45,75,.12)}
  .banner{display:flex;align-items:center;gap:13px;padding:18px}
  .banner .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
  .banner h1{font-size:21px;letter-spacing:.5px}
  .banner .sub{font-size:12px;margin-top:2px}
  .ok .banner{background:var(--okbg);border-bottom:1px solid var(--okbr)}
  .ok .ic{background:#fff;color:var(--ok)} .ok h1{color:var(--ok)} .ok .sub{color:#3d7c58}
  .bad .banner{background:var(--badbg);border-bottom:1px solid var(--badbr)}
  .bad .ic{background:#fff;color:var(--bad)} .bad h1{color:var(--bad)} .bad .sub{color:#a06457}
  .who{padding:18px 18px 6px;text-align:center}
  .who .name{font-size:25px;font-weight:700;color:var(--brand);line-height:1.1}
  .who .co{font-size:13px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:1.5px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  td{padding:9px 18px;font-size:14px;border-top:1px solid var(--line)}
  td.l{color:var(--text2);font-size:11.5px;text-transform:uppercase;letter-spacing:1px;width:128px}
  td.v{font-weight:600} .mono{font-family:Consolas,monospace;font-size:13px}
  .chip{display:inline-block;padding:2px 10px;border-radius:14px;font-size:11.5px;font-weight:700}
  .chip.ok{background:var(--okbg);color:var(--ok)} .chip.bad{background:var(--badbg);color:var(--bad)}
  .multi{padding:4px 0 8px}
  .crow{padding:10px 18px;border-top:1px solid var(--line)}
  .crow .k{font-weight:600;font-size:14px}
  .crow .m{font-size:11.5px;color:var(--muted);margin-top:2px}
  .crow .chip{float:right;margin-top:3px}
  .auth{margin:14px 18px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#F7F9FC}
  .auth b{font-size:12.5px;color:var(--brand)}
  .auth p{font-size:11.5px;color:var(--text2);line-height:1.55;margin-top:4px}
  .auth .vc{font-family:Consolas,monospace;font-weight:700;color:var(--brand)}
  .foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .foot .sm{font-size:10.5px;color:var(--muted);line-height:1.5}
  .land{max-width:480px;text-align:center;padding:40px 18px;color:var(--text2);font-size:14px;line-height:1.7}
  .scanned{font-size:10.5px;color:var(--muted);margin-top:14px;text-align:center}
  .err{max-width:480px;background:var(--badbg);border:1px solid var(--badbr);border-radius:12px;padding:18px;color:var(--bad);font-size:14px;text-align:center}
</style>
</head>
<body>
  <div class="brand"><div class="mark">C</div><div><b>CertiCerts</b><span> · Training Verification</span></div></div>
  <div id="root"></div>
  <div class="scanned" id="scanned"></div>
<script>
(function(){
  const root=document.getElementById('root');
  const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function b64uDecode(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; const bin=atob(s); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
  function fmt(d){ if(!d) return ''; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d); if(!m) return d;
    const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
    return MO[+m[2]-1]+' '+(+m[3])+', '+m[1]; }
  function statusOf(ed){ if(!ed) return {ok:true,label:'VALID',sub:'No expiry'}; const today=new Date().toISOString().slice(0,10);
    return ed>=today ? {ok:true,label:'VALID',sub:'Expires '+fmt(ed)} : {ok:false,label:'EXPIRED',sub:'Expired '+fmt(ed)}; }
  const hash=location.hash.slice(1);
  if(!hash){ root.innerHTML='<div class="land"><b style="color:var(--brand)">Scan a CertiCerts QR code</b><br>This page displays training-certificate verification records. Scan the QR on a certificate or wallet card to view one.</div>'; return; }
  let d; try{ d=JSON.parse(b64uDecode(hash)); }catch(e){
    root.innerHTML='<div class="err"><b>Could not read this verification code.</b><br>The link appears incomplete or damaged. Re-scan the QR code, or confirm the certificate number directly with the issuer.</div>'; return; }
  const isMulti=Array.isArray(d.list);
  const issuer=d.co||d.c||'';
  // Online check (team sync stage 5): a single certificate with a number + verification code is looked up
  // in the issuer's live records. Fixed address — never taken from the link, so a crafted link can't
  // point the page at a server that says "valid". No record / no internet -> the QR's own record as before.
  // Testing only: ?api= is honoured when it points at THIS computer (a local worker) — never another site.
  const apiParam=new URLSearchParams(location.search).get('api')||'';
  const LIVE_API=/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/api\/verify$/.test(apiParam)?apiParam:'https://certicerts.com/api/verify';
  function card(head, name, co, body, extra, footIssuer){
    root.innerHTML='<div class="card '+(head.ok?'ok':'bad')+'">'+
      '<div class="banner"><div class="ic">'+(head.ok?'✓':'✕')+'</div><div><h1>'+esc(head.label)+'</h1><div class="sub">'+esc(head.sub)+'</div></div></div>'+
      '<div class="who"><div class="name">'+esc(name||'')+'</div>'+(co?('<div class="co">'+esc(co)+'</div>'):'')+'</div>'+
      body+extra+
      '<div class="foot"><div class="mark" style="width:22px;height:22px;font-size:12px;border-radius:6px">C</div><div class="sm">Issued via <b>CertiCerts™</b>'+(footIssuer?(' on behalf of <b>'+esc(footIssuer)+'</b>'):'')+'. '+
      (head.live?'Status checked online against the issuer’s live records.':'This page renders the record carried in the QR code; the issuer’s application holds the authoritative database.')+'</div></div>'+
    '</div>'; }
  function rows(k,no,td,ed,chip){ return '<table>'+
      (k?('<tr><td class="l">Course</td><td class="v">'+esc(k)+'</td></tr>'):'')+
      (no?('<tr><td class="l">Certificate</td><td class="v mono">'+esc(no)+'</td></tr>'):'')+
      (td?('<tr><td class="l">Issued</td><td class="v">'+fmt(td)+'</td></tr>'):'')+
      ('<tr><td class="l">Expires</td><td class="v">'+(ed?fmt(ed):'No expiry')+' '+chip+'</td></tr>')+
      '</table>'; }
  const authBlock=d.vc?('<div class="auth"><b>Authenticity code: <span class="vc">'+esc(d.vc)+'</span></b><p>This code is generated from the certificate details and a key held only by the issuer’s CertiCerts installation. To confirm this record, ask the issuer to look up the certificate number in CertiCerts — only their installation can reproduce a matching code. This page shows the record carried in the QR; it does not itself check the code.</p></div>'):'';
  function note(t){ return '<div class="auth" id="liveNote"><p style="margin:0">'+t+'</p></div>'; }
  function offlineView(live){   // the record carried in the QR (+ what the online check said, if anything)
    const st=statusOf(d.ed);
    const extra=(live==='checking'?note('Checking online with the issuer’s records…'):
      live==='notfound'?note('No online record was found for this certificate. The details above are carried in the QR code itself.'):
      live==='offline'?note('The online check could not be reached just now. The details above are carried in the QR code itself.'):'')+authBlock;
    card({ok:st.ok,label:st.ok?'TRAINING VERIFIED · VALID':'CERTIFICATE EXPIRED',sub:st.sub}, d.n, issuer,
      rows(d.k,d.no,d.td,d.ed,'<span class="chip '+(st.ok?'ok':'bad')+'">'+st.label+'</span>'), extra, issuer); }
  function liveView(r){   // the issuer's live record wins (revocation, corrected details)
    const when=new Date(r.checked_at||Date.now()).toLocaleString();
    let head, chip;
    if(r.status==='revoked'){ const on=r.revoked_at?String(r.revoked_at).slice(0,10):'';
      head={ok:false,live:true,label:'CERTIFICATE REVOKED',sub:'Revoked by the issuer'+(on?' on '+fmt(on):'')}; chip='<span class="chip bad">REVOKED</span>'; }
    else if(r.status==='expired'){ head={ok:false,live:true,label:'CERTIFICATE EXPIRED',sub:'Expired '+fmt(r.expiry_date)}; chip='<span class="chip bad">EXPIRED</span>'; }
    else { head={ok:true,live:true,label:'TRAINING VERIFIED · VALID',sub:r.expiry_date?'Expires '+fmt(r.expiry_date):'No expiry'}; chip='<span class="chip ok">VALID</span>'; }
    const reason=r.status==='revoked'&&r.revoked_reason?('<tr><td class="l">Reason</td><td class="v">'+esc(r.revoked_reason)+'</td></tr>'):'';
    const body=rows(r.course,d.no,r.training_date,r.expiry_date,chip).replace('</table>',reason+'</table>');
    card(head, r.holder, r.company||issuer, body,
      '<div class="auth" id="liveNote"><b style="color:'+(head.ok?'var(--ok)':'var(--bad)')+'">'+(head.ok?'✓ ':'')+'Checked online</b><p>Status confirmed against '+esc(r.issuer||'the issuer')+'’s live CertiCerts records at '+esc(when)+'.</p></div>', r.issuer||issuer); }
  if(isMulti){
    const rows2=d.list.map(x=>{ const st=statusOf(x.ed); return '<div class="crow"><span class="chip '+(st.ok?'ok':'bad')+'">'+st.label+'</span><div class="k">'+esc(x.k)+'</div><div class="m">'+(x.td?fmt(x.td)+' → ':'')+(x.ed?fmt(x.ed):'No expiry')+(x.no?' · '+esc(x.no):'')+'</div></div>'; }).join('');
    const anyValid=d.list.some(x=>statusOf(x.ed).ok);
    card({ok:anyValid,label:anyValid?'TRAINING VERIFIED':'ALL EXPIRED',sub:d.list.length+' certificate(s) on record'}, d.n, issuer,
      '<div class="multi">'+rows2+'</div>'+(d.more?('<div class="crow"><div class="m">+ '+d.more+' more certificate(s) — see the issuer’s CertiCerts records</div></div>'):''), authBlock, issuer);
  } else if(d.no && d.vc){
    offlineView('checking');
    const ctl=('AbortController' in window)?new AbortController():null; const t=setTimeout(()=>{ try{ ctl&&ctl.abort(); }catch(e){} }, 8000);
    fetch(LIVE_API+'?no='+encodeURIComponent(d.no)+'&vc='+encodeURIComponent(d.vc),{cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(r=>{ clearTimeout(t); if(r&&r.found) liveView(r); else offlineView('notfound'); })
      .catch(()=>{ clearTimeout(t); offlineView('offline'); });
  } else {
    offlineView('');
  }
  document.getElementById('scanned').textContent='Viewed '+new Date().toLocaleString();
})();
</script>
</body>
</html>
